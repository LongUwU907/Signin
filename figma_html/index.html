<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="signup">
      <div class="content">
        <div class="title">Get Started Now</div>
        <div class="form">
          <div class="input-group">
            <div>name</div>
            <input type="text" placeholder="Enter your name" />
          </div>
          <div class="input-group">
            <div>email</div>
            <input type="text" placeholder="Enter your email" />
          </div>
          <div class="input-group">
            <div class="label-row">
              <div>password</div>
              <a href="#" class="forgot-pass">forgot password</a>
            </div>
            <input type="password" placeholder="Enter your password" />
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="terms" />
            <label for="terms">Remember for 30 days</label>
          </div>
          <div class="button-group">
            <button>sign up</button>
          </div>
          <div class="divider">or</div>

          <div class="social-login">
            <button class="btn-social">
              <img src="images/icon_google.svg" alt="google" />
              <span>Sign up with Google</span>
            </button>
            <button class="btn-social">
              <img src="images/icon_apple.svg" alt="apple" />
              <span>Sign up with Apple</span>
            </button>
          </div>

          <div class="footer-text">
            Don't have an account? <a href="#">Sign In</a>
          </div>
        </div>
      </div>
      <div class="images">
        <img src="images/background_auth.png" alt="signup" />
      </div>
    </div>
  </body>
</html>
